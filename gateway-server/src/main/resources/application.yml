server:
  tomcat:
    max-connections: 10000
  port: 8090 #自定义端口号
  address: 0.0.0.0

spring:
  profiles:
    #运行的环境
    active: @spring.profiles.active@
  application:
    name: gateway-server
  config:
    import:
      - optional:nacos:gateway.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    loadbalancer:
      nacos:
        enabled: true
      cache:
        enabled: false
      retry:
        enabled: true
        max-retries-on-same-service-instance: 1
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false

logging:
  level:
    root: info
    com.luna: DEBUG
    org.springframework.cloud.gateway: DEBUG

