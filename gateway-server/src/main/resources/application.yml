server:
  tomcat:
    max-connections: 10000
  port: 8090 #自定义端口号
  address: 0.0.0.0

spring:
  profiles:
    #运行的环境
    active: @spring.profiles.active@
  application:
    name: gateway-server
  config:
    import:
      - optional:nacos:gateway.yml
  data:
    redis:
      # Redis服务器地址
      host: ${gatewayserver.redis.host}
      # Redis服务器端口号
      port: ${gatewayserver.redis.port}
      # 使用的数据库索引，默认是0
      database: 0
      # 连接超时时间
      timeout: 1800000
      # 设置密码
      lettuce:
        pool:
          # 最大阻塞等待时间，负数表示没有限制
          max-wait: -1
          # 连接池中的最大空闲连接
          max-idle: 5
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中最大连接数，负数表示没有限制
          max-active: 20
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false
    loadbalancer:
      nacos:
        enabled: true
      cache:
        enabled: false
      retry:
        enabled: true
        max-retries-on-same-service-instance: 1
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false

logging:
  level:
    root: info
    com.luna: DEBUG
    org.springframework.cloud.gateway: DEBUG

