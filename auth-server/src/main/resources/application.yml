server:
  tomcat:
    max-connections: 10000
  port: 8091 #自定义端口号
  address: 0.0.0.0

spring:
  profiles:
    #运行的环境
    active: @spring.profiles.active@
  application:
    name: auth-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false

    loadbalancer:
      nacos:
        enabled: true
      cache:
        enabled: false
      retry:
        enabled: true
        max-retries-on-same-service-instance: 1
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
  datasource:
    url: jdbc:mysql://${authserver.mysql.ip}:${authserver.mysql.port}/${authserver.mysql.db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${authserver.mysql.username}
    password: ${authserver.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Redis服务器地址
      host: ${authserver.redis.host}
      # Redis服务器端口号
      port: ${authserver.redis.port}
      # 使用的数据库索引，默认是0
      database: 0
      # 连接超时时间
      timeout: 1800000
      # 设置密码
      lettuce:
        pool:
          # 最大阻塞等待时间，负数表示没有限制
          max-wait: -1
          # 连接池中的最大空闲连接
          max-idle: 5
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中最大连接数，负数表示没有限制
          max-active: 20

resilience4j:
  retry: # 重试器
    instances:
      retryApi:
        maxAttempts: 3
        waitDuration: 1 # 10秒
  circuitBreaker: # 熔断器
    instances:
      circuitBreakerApi:
        registerHealthIndicator: true # 注册健康指示器
        slidingWindowSize: 10        # 熔断器滑动窗口大
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 20
        eventConsumerBufferSize: 10 # 事件消费者缓冲区大小
  rateLimiter: # 限流器
    instances:
      rateLimiterService:
        limitForPeriod: 1 # 每秒限制的请求数
        limitRefreshPeriod: 1s # 限制的刷新时间，单位秒
        timeoutDuration: 100ms # 超时时间，单位秒

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xiaominfo.knife4j.demo.web

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# Dubbo配置
dubbo:
  application:
    name: auth-server
    version: 1.0.0
  registry:
    address: nacos://localhost:8848
    group: DEFAULT_GROUP
  consumer:
    timeout: 3000
    retries: 2
    check: false
    loadbalance: roundrobin
  metadata-report:
    address: nacos://localhost:8848


